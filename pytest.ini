[pytest]
pythonpath = .
testpaths = tests
markers =
    optional: Optional test, opted out of default CI runs. Run with
        `pytest -m optional <path>` to include. Used by the retired
        CP-SAT stress/unit tests after the 2026-04-10 scheduler rewrite.
addopts = -m "not optional"
filterwarnings =
    ignore::DeprecationWarning
