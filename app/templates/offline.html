<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2E4C73">
    <title>Offline - PC Events</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #F5F7FA;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .offline-container {
            text-align: center;
            max-width: 400px;
        }
        .offline-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            opacity: 0.6;
        }
        h1 {
            font-size: 1.5rem;
            color: #2E4C73;
            margin-bottom: 0.75rem;
        }
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        .retry-btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: #2E4C73;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            min-height: 44px;
            min-width: 44px;
            transition: background 0.2s;
        }
        .retry-btn:hover { background: #1E3A5F; }
        .retry-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">&#x1F4F6;</div>
        <h1>You're Offline</h1>
        <p>It looks like you've lost your internet connection. Check your Wi-Fi or data and try again.</p>
        <button class="retry-btn" id="offline-retry-btn">Try Again</button>
    </div>
    <script>
        document.getElementById('offline-retry-btn').addEventListener('click', function() {
            window.location.reload();
        });
    </script>
</body>
</html>
