{% extends "base.html" %}

{% block title %}Monthly Schedule - Product Connections{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/my-schedule-monthly.css') }}?v={{ config.get('VERSION', '') }}">
{% endblock %}

{% block content %}
<div class="monthly">
    <div class="monthly__header">
        <button class="monthly__nav" id="monthPrev" aria-label="Previous month">
            <span class="material-symbols-outlined">chevron_left</span>
        </button>
        <h1 class="monthly__title" id="monthTitle">Loading...</h1>
        <button class="monthly__nav" id="monthNext" aria-label="Next month">
            <span class="material-symbols-outlined">chevron_right</span>
        </button>
        <button class="monthly__today-btn" id="monthToday">Today</button>
    </div>

    <div class="monthly__day-names">
        <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
    </div>
    <div class="monthly__grid" id="monthGrid">
        <div class="monthly__loading">
            <span class="material-symbols-outlined">hourglass_empty</span>
            Loading schedule...
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
    var monthGrid = document.getElementById('monthGrid');
    var monthTitle = document.getElementById('monthTitle');

    var todayDate = new Date();
    todayDate.setHours(0, 0, 0, 0);
    var currentYear = todayDate.getFullYear();
    var currentMonth = todayDate.getMonth();

    var MONTH_NAMES = [
        'January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'
    ];

    function formatDateISO(y, m, d) {
        return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    }

    function loadMonth() {
        var monthStr = currentYear + '-' + String(currentMonth + 1).padStart(2, '0');
        monthTitle.textContent = MONTH_NAMES[currentMonth] + ' ' + currentYear;
        monthGrid.innerHTML = '<div class="monthly__loading"><span class="material-symbols-outlined">hourglass_empty</span>Loading schedule...</div>';

        fetch('/api/my-schedule/monthly?month=' + monthStr)
            .then(function(resp) {
                if (!resp.ok) throw new Error('Failed');
                return resp.json();
            })
            .then(function(data) {
                renderGrid(data.days || {});
            })
            .catch(function() {
                monthGrid.innerHTML = '<div class="monthly__loading"><span class="material-symbols-outlined">error</span>Error loading schedule</div>';
            });
    }

    function renderGrid(days) {
        var firstDay = new Date(currentYear, currentMonth, 1).getDay();
        var daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        var todayStr = formatDateISO(todayDate.getFullYear(), todayDate.getMonth(), todayDate.getDate());

        var html = '';

        // Leading empty cells
        for (var i = 0; i < firstDay; i++) {
            html += '<div class="monthly__cell monthly__cell--empty"></div>';
        }

        // Day cells
        for (var d = 1; d <= daysInMonth; d++) {
            var dateStr = formatDateISO(currentYear, currentMonth, d);
            var isToday = dateStr === todayStr;
            var events = days[dateStr] || [];

            html += '<div class="monthly__cell' + (isToday ? ' monthly__cell--today' : '') +
                (events.length > 0 ? ' monthly__cell--scheduled' : '') + '">';
            html += '<span class="monthly__cell-num">' + d + '</span>';

            if (events.length > 0) {
                // Show earliest start time
                html += '<span class="monthly__cell-time">' + events[0].time + '</span>';
            } else {
                html += '<span class="monthly__cell-off">OFF</span>';
            }

            html += '</div>';
        }

        // Trailing empty cells
        var totalCells = firstDay + daysInMonth;
        var remainder = totalCells % 7;
        if (remainder > 0) {
            for (var j = 0; j < 7 - remainder; j++) {
                html += '<div class="monthly__cell monthly__cell--empty"></div>';
            }
        }

        monthGrid.innerHTML = html;
    }

    // Navigation
    document.getElementById('monthPrev').addEventListener('click', function() {
        currentMonth--;
        if (currentMonth < 0) { currentMonth = 11; currentYear--; }
        loadMonth();
    });

    document.getElementById('monthNext').addEventListener('click', function() {
        currentMonth++;
        if (currentMonth > 11) { currentMonth = 0; currentYear++; }
        loadMonth();
    });

    document.getElementById('monthToday').addEventListener('click', function() {
        currentYear = todayDate.getFullYear();
        currentMonth = todayDate.getMonth();
        loadMonth();
    });

    loadMonth();
})();
</script>
{% endblock %}
